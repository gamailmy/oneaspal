<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Game Catur 3D Online</title>
  <style>
    body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: 'Helvetica Neue', sans-serif; color: white; }
    
    /* Panel UI Minimalis */
    #ui { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 8px; font-size: 12px; backdrop-filter: blur(5px); z-index: 10; min-width: 160px; transition: all 0.3s ease; }
    
    #status { font-weight: bold; color: #fbbf24; margin-bottom: 6px; font-size: 12px; text-align: center; }
    
    .player-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px; border-radius: 4px; margin-bottom: 2px; font-size: 11px; transition: background-color 0.3s, border-color 0.3s; border: 1px solid transparent; }
    .player-row.active { background-color: rgba(34, 197, 94, 0.2); border-color: rgba(34, 197, 94, 0.6); }
    .player-row.waiting { background-color: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.3); }
    
    .dot { width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; display: inline-block; }
    .dot.active { background: #22c55e; box-shadow: 0 0 4px #22c55e; }
    .dot.waiting { background: #ef4444; }
    
    #controls { display: flex; gap: 4px; margin-top: 6px; }
    #controls button { flex: 1; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 5px 8px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px; }
    #controls button:active { transform: scale(0.95); background: rgba(255,255,255,0.2); }
    
    #history-container { margin-top: 6px; max-height: 120px; overflow-y: auto; background: rgba(0,0,0,0.3); padding: 6px; border-radius: 4px; display: none; }
    #history-container.visible { display: block; }
    #move-history { list-style: none; padding: 0; margin: 0; }
    #move-history li { font-size: 10px; color: #eee; margin-bottom: 3px; padding: 3px 4px; border-radius: 3px; background: rgba(255,255,255,0.05); }
    
    #canvas-container { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; touch-action: none; }
    #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 14px; color: #ccc; text-align: center; }
  </style>
</head>
<body>
  <div id="ui">
    <div id="status">Memuat Partai...</div>
    
    <div class="player-row waiting" id="white-player">
      <span style="display:flex; align-items:center;"><span class="dot waiting"></span> <span id="white-name">...</span></span>
      <span id="white-status">Menunggu</span>
    </div>
    <div class="player-row waiting" id="black-player">
      <span style="display:flex; align-items:center;"><span class="dot waiting"></span> <span id="black-name">...</span></span>
      <span id="black-status">Menunggu</span>
    </div>
    
    <div id="controls">
      <button id="toggle-history-btn">Langkah</button>
      <button id="reset-btn">Ulang</button>
    </div>
    
    <div id="history-container">
      <ul id="move-history"></ul>
    </div>
  </div>
  
  <div id="loading">Mempersiapkan papan...</div>
  <div id="canvas-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script>
    let scene, camera, renderer, controls;
    let board = [];
    let pieces = [];
    let selectedPiece = null;
    let chess = new Chess();
    let raycaster, mouse;

    let matchId = null;
    let playerId = null;
    let myColor = null;
    let isBoardReady = false;
    let matchStatus = 'pending';
    
    const pieceNames = { p: 'Pion', r: 'Benteng', n: 'Kuda', b: 'Gajah', q: 'Ratu', k: 'Raja' };

    const urlParams = new URLSearchParams(window.location.search);
    matchId = urlParams.get('matchId');
    playerId = urlParams.get('playerId');

    const firebaseConfig = {
      apiKey: "AIzaSyC_Lp9IMTfC0D1pSFeDbjW2ugyg22tFfTc",
      authDomain: "oneaspalclub.firebaseapp.com",
      databaseURL: "https://oneaspalclub-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "oneaspalclub",
      storageBucket: "oneaspalclub.firebasestorage.app",
      messagingSenderId: "310756119151",
      appId: "1:310756119151:web:da5d0ccbc43dad23c5b39a"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    init();
    animate();

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a1a);
      
      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 8, 8);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.getElementById('canvas-container').appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.1;
      controls.minDistance = 5;
      controls.maxDistance = 15;
      controls.maxPolarAngle = Math.PI / 2.2;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);
      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(5, 10, 5);
      scene.add(directionalLight);
      const sideLight = new THREE.DirectionalLight(0xffffff, 0.3);
      sideLight.position.set(-5, 5, -5);
      scene.add(sideLight);

      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      createBoard();

      window.addEventListener('resize', onWindowResize);
      renderer.domElement.addEventListener('pointerdown', onPointerDown);

      document.getElementById('reset-btn').addEventListener('click', resetGame);
      document.getElementById('toggle-history-btn').addEventListener('click', () => {
        document.getElementById('history-container').classList.toggle('visible');
      });

      if (matchId) {
        listenToMatch();
      } else {
        document.getElementById('status').innerText = "Error: Match ID tidak ditemukan.";
        document.getElementById('loading').style.display = 'none';
      }
    }

    function getFirstName(name) {
      if (!name) return 'Pemain';
      return name.split(' ')[0];
    }

    function listenToMatch() {
      db.ref('chessMatches/' + matchId).on('value', (snapshot) => {
        const match = snapshot.val();
        if (!match) {
          document.getElementById('status').innerText = "Partai tidak ditemukan.";
          document.getElementById('loading').style.display = 'none';
          return;
        }
        
        if (match.whitePlayer && match.whitePlayer.id === playerId) myColor = 'w';
        if (match.blackPlayer && match.blackPlayer.id === playerId) myColor = 'b';
        
        document.getElementById('white-name').innerText = getFirstName(match.whitePlayer?.name) + ' (Putih)';
        document.getElementById('black-name').innerText = getFirstName(match.blackPlayer?.name) + ' (Hitam)';
        
        matchStatus = match.status || 'pending';
        
        chess.reset();
        const movesData = match.moves ? Object.keys(match.moves).map(k => match.moves[k]).sort((a,b) => a.timestamp - b.timestamp) : [];
        movesData.forEach(m => {
          chess.move({ from: m.from, to: m.to, promotion: m.promotion || 'q' });
        });
        
        updatePieces();
        updateHistory();
        isBoardReady = true;
        document.getElementById('loading').style.display = 'none';
      });
    }

    function createTextSprite(text) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 128;
      canvas.height = 128;
      ctx.fillStyle = '#999999';
      ctx.font = 'bold 80px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 64, 64);
      
      const texture = new THREE.CanvasTexture(canvas);
      const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(material);
      sprite.scale.set(0.6, 0.6, 0.6);
      return sprite;
    }

    function createBoard() {
      const squareSize = 1;
      const geometry = new THREE.BoxGeometry(squareSize, 0.2, squareSize);
      
      for (let x = 0; x < 8; x++) {
        board[x] = [];
        for (let z = 0; z < 8; z++) {
          const isWhite = (x + z) % 2 === 0;
          const material = new THREE.MeshLambertMaterial({ color: isWhite ? 0xe0e0e0 : 0x4a4a4a });
          const square = new THREE.Mesh(geometry, material);
          square.position.set(x - 3.5, 0, z - 3.5);
          square.userData = { x, z, isWhite, isSquare: true };
          scene.add(square);
          board[x][z] = square;
        }
      }
      
      const baseGeo = new THREE.BoxGeometry(9, 0.5, 9);
      const baseMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
      const base = new THREE.Mesh(baseGeo, baseMat);
      base.position.y = -0.3;
      scene.add(base);
      
      const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
      for (let i = 0; i < 8; i++) {
        const fileSpriteBottom = createTextSprite(files[i]);
        fileSpriteBottom.position.set(i - 3.5, 0.15, 4.2);
        scene.add(fileSpriteBottom);
        
        const fileSpriteTop = createTextSprite(files[i]);
        fileSpriteTop.position.set(i - 3.5, 0.15, -4.2);
        scene.add(fileSpriteTop);
        
        const rankSpriteLeft = createTextSprite((i + 1).toString());
        rankSpriteLeft.position.set(-4.2, 0.15, 3.5 - i);
        scene.add(rankSpriteLeft);
        
        const rankSpriteRight = createTextSprite((i + 1).toString());
        rankSpriteRight.position.set(4.2, 0.15, 3.5 - i);
        scene.add(rankSpriteRight);
      }
    }

    function createPiece(type, color, x, z) {
      const group = new THREE.Group();
      const material = new THREE.MeshPhongMaterial({ 
        color: color === 'w' ? 0xf0f0f0 : 0x1a1a1a, 
        shininess: 40, 
        specular: 0x333333 
      });
      
      const createLathe = (points) => {
        const geometry = new THREE.LatheGeometry(points, 24);
        geometry.computeVertexNormals();
        return new THREE.Mesh(geometry, material);
      };

      let mesh;

      switch(type) {
        case 'p': { // Pion
          const points = [
            new THREE.Vector2(0.0, 0.0), new THREE.Vector2(0.28, 0.0),
            new THREE.Vector2(0.28, 0.04), new THREE.Vector2(0.22, 0.1),
            new THREE.Vector2(0.14, 0.15), new THREE.Vector2(0.14, 0.35),
            new THREE.Vector2(0.2, 0.4), new THREE.Vector2(0.14, 0.45),
            new THREE.Vector2(0.14, 0.5), new THREE.Vector2(0.24, 0.55),
            new THREE.Vector2(0.14, 0.6), new THREE.Vector2(0.2, 0.7),
            new THREE.Vector2(0.15, 0.78), new THREE.Vector2(0.0, 0.8)
          ];
          mesh = createLathe(points);
          break;
        }
        case 'r': { // Benteng
          const points = [
            new THREE.Vector2(0.0, 0.0), new THREE.Vector2(0.32, 0.0),
            new THREE.Vector2(0.32, 0.05), new THREE.Vector2(0.26, 0.1),
            new THREE.Vector2(0.2, 0.15), new THREE.Vector2(0.18, 0.55),
            new THREE.Vector2(0.24, 0.6), new THREE.Vector2(0.28, 0.65),
            new THREE.Vector2(0.28, 0.75), new THREE.Vector2(0.24, 0.8),
            new THREE.Vector2(0.24, 0.85), new THREE.Vector2(0.0, 0.85)
          ];
          mesh = createLathe(points);
          for(let i=0; i<4; i++) {
            const cren = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.1, 0.12), material);
            const angle = (i / 4) * Math.PI * 2 + Math.PI / 4;
            cren.position.set(Math.cos(angle) * 0.18, 0.85, Math.sin(angle) * 0.18);
            group.add(cren);
          }
          break;
        }
        case 'b': { // Gajah
          const points = [
            new THREE.Vector2(0.0, 0.0), new THREE.Vector2(0.3, 0.0),
            new THREE.Vector2(0.3, 0.05), new THREE.Vector2(0.24, 0.1),
            new THREE.Vector2(0.18, 0.15), new THREE.Vector2(0.16, 0.5),
            new THREE.Vector2(0.22, 0.55), new THREE.Vector2(0.16, 0.6),
            new THREE.Vector2(0.18, 0.65), new THREE.Vector2(0.24, 0.7),
            new THREE.Vector2(0.2, 0.75), new THREE.Vector2(0.18, 0.8),
            new THREE.Vector2(0.12, 0.9), new THREE.Vector2(0.08, 0.95),
            new THREE.Vector2(0.0, 0.95)
          ];
          mesh = createLathe(points);
          const slit = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.15, 0.3), material);
          slit.position.set(0, 0.85, 0);
          slit.rotation.y = Math.PI / 4;
          group.add(slit);
          const top = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), material);
          top.position.y = 1.0;
          group.add(top);
          break;
        }
        case 'q': { // Ratu
          const points = [
            new THREE.Vector2(0.0, 0.0), new THREE.Vector2(0.35, 0.0),
            new THREE.Vector2(0.35, 0.05), new THREE.Vector2(0.28, 0.1),
            new THREE.Vector2(0.2, 0.15), new THREE.Vector2(0.18, 0.6),
            new THREE.Vector2(0.24, 0.65), new THREE.Vector2(0.18, 0.7),
            new THREE.Vector2(0.2, 0.75), new THREE.Vector2(0.3, 0.8),
            new THREE.Vector2(0.32, 0.85), new THREE.Vector2(0.28, 0.9),
            new THREE.Vector2(0.28, 0.95), new THREE.Vector2(0.0, 1.0)
          ];
          mesh = createLathe(points);
          for(let i=0; i<8; i++) {
            const ball = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 12), material);
            const angle = (i / 8) * Math.PI * 2;
            ball.position.set(Math.cos(angle) * 0.28, 0.95, Math.sin(angle) * 0.28);
            group.add(ball);
          }
          break;
        }
        case 'k': { // Raja
          const points = [
            new THREE.Vector2(0.0, 0.0), new THREE.Vector2(0.35, 0.0),
            new THREE.Vector2(0.35, 0.05), new THREE.Vector2(0.28, 0.1),
            new THREE.Vector2(0.22, 0.15), new THREE.Vector2(0.2, 0.7),
            new THREE.Vector2(0.26, 0.75), new THREE.Vector2(0.2, 0.8),
            new THREE.Vector2(0.22, 0.85), new THREE.Vector2(0.32, 0.9),
            new THREE.Vector2(0.34, 0.95), new THREE.Vector2(0.3, 1.0),
            new THREE.Vector2(0.0, 1.0)
          ];
          mesh = createLathe(points);
          const crossV = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.25, 0.08), material);
          crossV.position.y = 1.12;
          group.add(crossV);
          const crossH = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.08, 0.08), material);
          crossH.position.y = 1.15;
          group.add(crossH);
          break;
        }
        case 'n': { // Kuda
          const basePoints = [
            new THREE.Vector2(0.0, 0.0), new THREE.Vector2(0.3, 0.0),
            new THREE.Vector2(0.3, 0.05), new THREE.Vector2(0.24, 0.1),
            new THREE.Vector2(0.2, 0.15), new THREE.Vector2(0.18, 0.2),
            new THREE.Vector2(0.0, 0.2)
          ];
          const baseMesh = createLathe(basePoints);
          group.add(baseMesh);
          
          const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 0.4, 16), material);
          neck.position.set(0, 0.4, 0.05);
          neck.rotation.x = -0.2;
          group.add(neck);
          
          const head = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.25, 0.4), material);
          head.position.set(0, 0.65, 0.1);
          head.rotation.x = -0.3;
          group.add(head);
          
          const muzzle = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.15, 0.2), material);
          muzzle.position.set(0, 0.62, 0.3);
          muzzle.rotation.x = -0.6;
          group.add(muzzle);
          
          const mane = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.45, 0.15), material);
          mane.position.set(0, 0.55, -0.1);
          mane.rotation.x = 0.3;
          group.add(mane);
          
          const ear1 = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.15, 8), material);
          ear1.position.set(0.08, 0.8, 0.05);
          group.add(ear1);
          const ear2 = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.15, 8), material);
          ear2.position.set(-0.08, 0.8, 0.05);
          group.add(ear2);
          
          const eyeMat = new THREE.MeshPhongMaterial({ color: 0x000000 });
          const eye1 = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 8), eyeMat);
          eye1.position.set(0.1, 0.72, 0.2);
          group.add(eye1);
          const eye2 = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 8), eyeMat);
          eye2.position.set(-0.1, 0.72, 0.2);
          group.add(eye2);
          
          break;
        }
      }
      
      if (mesh) group.add(mesh);
      group.scale.set(0.8, 0.8, 0.8);
      
      group.position.set(x - 3.5, 0.1, z - 3.5);
      const pieceData = { type, color, x, z, isPiece: true };
      group.userData = pieceData;
      group.traverse(child => {
        if (child.isMesh) child.userData = pieceData;
      });
      return group;
    }

    function updatePieces() {
      pieces.forEach(p => scene.remove(p));
      pieces = [];
      const boardData = chess.board();
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const piece = boardData[r][c];
          if (piece) {
            const x = c;
            const z = 7 - r;
            const piece3D = createPiece(piece.type, piece.color, x, z);
            pieces.push(piece3D);
            scene.add(piece3D);
          }
        }
      }
      updateStatus();
    }

    function resetGame() {
      if (matchId) db.ref('chessMatches/' + matchId + '/moves').remove();
    }

    function clearHighlights() {
      for (let x = 0; x < 8; x++) {
        for (let z = 0; z < 8; z++) {
          const isWhite = (x + z) % 2 === 0;
          board[x][z].material.color.setHex(isWhite ? 0xe0e0e0 : 0x4a4a4a);
        }
      }
    }

    function highlightMoves(moves) {
      moves.forEach(move => {
        const x = move.to.charCodeAt(0) - 'a'.charCodeAt(0);
        const z = parseInt(move.to.charAt(1)) - 1;
        board[x][z].material.color.setHex(0xfbbf24);
      });
    }

    function onPointerDown(event) {
      if (!isBoardReady || !myColor || matchStatus !== 'active' || chess.turn() !== myColor) return;

      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      
      const pieceIntersects = raycaster.intersectObjects(pieces, true);
      const squareIntersects = raycaster.intersectObjects(scene.children.filter(c => c.userData.isSquare !== undefined));

      if (pieceIntersects.length > 0) {
        const pieceData = pieceIntersects[0].object.userData;
        if (selectedPiece) {
          const from = String.fromCharCode(97 + selectedPiece.x) + (selectedPiece.z + 1);
          const to = String.fromCharCode(97 + pieceData.x) + (pieceData.z + 1);
          tryMove(from, to);
        } else {
          if (pieceData.color === myColor) {
            selectedPiece = pieceData;
            clearHighlights();
            const from = String.fromCharCode(97 + pieceData.x) + (pieceData.z + 1);
            highlightMoves(chess.moves({ square: from, verbose: true }));
          }
        }
      } else if (squareIntersects.length > 0) {
        const squareData = squareIntersects[0].object.userData;
        if (selectedPiece) {
          const from = String.fromCharCode(97 + selectedPiece.x) + (selectedPiece.z + 1);
          const to = String.fromCharCode(97 + squareData.x) + (squareData.z + 1);
          tryMove(from, to);
        }
      }
    }

    function tryMove(from, to) {
      const move = chess.move({ from, to, promotion: 'q' });
      if (move) {
        selectedPiece = null;
        clearHighlights();
        db.ref('chessMatches/' + matchId + '/moves').push({
          from: from, to: to, promotion: 'q', player: playerId, timestamp: Date.now()
        });
        updatePieces();
        updateHistory();
      } else {
        selectedPiece = null;
        clearHighlights();
      }
    }

    function updateHistory() {
      const historyList = document.getElementById('move-history');
      historyList.innerHTML = '';
      const history = chess.history({ verbose: true });
      
      history.forEach((h, index) => {
        const li = document.createElement('li');
        const color = h.color === 'w' ? 'Putih' : 'Hitam';
        const piece = pieceNames[h.piece] || 'Bidak';
        let text = `${index + 1}. ${color} - ${piece}: ${h.from} ➔ ${h.to}`;
        
        if (h.captured) text += ` (Makan ${pieceNames[h.captured]})`;
        if (h.flags.includes('e')) text += ' (En Passant)';
        if (h.flags.includes('k') || h.flags.includes('q')) text += ' (Castling)';
        if (h.flags.includes('c')) text += ' (Skak!)';
        
        li.innerText = text;
        historyList.appendChild(li);
      });
      
      historyList.scrollTop = historyList.scrollHeight;
    }

    function updateStatus() {
      let statusText = "";
      const turn = chess.turn();
      
      const whiteRow = document.getElementById('white-player');
      const blackRow = document.getElementById('black-player');
      const whiteDot = whiteRow.querySelector('.dot');
      const blackDot = blackRow.querySelector('.dot');
      const whiteStatus = document.getElementById('white-status');
      const blackStatus = document.getElementById('black-status');
      
      whiteRow.classList.remove('active', 'waiting');
      blackRow.classList.remove('active', 'waiting');
      whiteDot.classList.remove('active', 'waiting');
      blackDot.classList.remove('active', 'waiting');
      
      if (matchStatus === 'pending') {
        statusText = "Menunggu Undangan Diterima...";
        whiteStatus.innerText = "Menunggu";
        blackStatus.innerText = "Menunggu";
        whiteRow.classList.add('waiting');
        blackRow.classList.add('waiting');
        whiteDot.classList.add('waiting');
        blackDot.classList.add('waiting');
      } else if (matchStatus === 'active') {
        if (turn === 'w') {
          whiteRow.classList.add('active');
          blackRow.classList.add('waiting');
          whiteDot.classList.add('active');
          blackDot.classList.add('waiting');
          whiteStatus.innerText = "Giliran";
          blackStatus.innerText = "Menunggu";
        } else {
          whiteRow.classList.add('waiting');
          blackRow.classList.add('active');
          whiteDot.classList.add('waiting');
          blackDot.classList.add('active');
          whiteStatus.innerText = "Menunggu";
          blackStatus.innerText = "Giliran";
        }
        
        if (chess.in_checkmate()) {
          statusText = "Skakmat! Pemenang: " + (turn === 'w' ? 'Hitam' : 'Putih');
        } else if (chess.in_check()) {
          statusText = "Skak! Giliran: " + (turn === 'w' ? 'Putih' : 'Hitam');
        } else {
          statusText = "Sedang Bermain";
        }
      }
      
      document.getElementById('status').innerText = statusText;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
