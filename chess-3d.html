<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Game Catur 3D Online</title>
  <style>
    body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: 'Helvetica Neue', sans-serif; color: white; }
    #ui { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 8px; font-size: 14px; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.1); z-index: 10; }
    #status { font-weight: bold; color: #fbbf24; margin-bottom: 5px; }
    #turn { font-size: 12px; color: #ccc; }
    #reset-btn { margin-top: 10px; background: #fbbf24; color: #000; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; box-sizing: border-box; }
    #reset-btn:active { transform: scale(0.95); }
    #canvas-container { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; touch-action: none; }
  </style>
</head>
<body>
  <div id="ui">
    <div id="status">Memuat Partai...</div>
    <div id="turn"></div>
    <button id="reset-btn">Mulai Ulang</button>
  </div>
  <div id="canvas-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script>
    let scene, camera, renderer, controls;
    let board = [];
    let pieces = [];
    let selectedPiece = null;
    let chess = new Chess();
    let raycaster, mouse;

    let matchId = null;
    let playerId = null;
    let myColor = null;
    let isBoardReady = false;

    // Parse URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    matchId = urlParams.get('matchId');
    playerId = urlParams.get('playerId');

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyC_Lp9IMTfC0D1pSFeDbjW2ugyg22tFfTc",
      authDomain: "oneaspalclub.firebaseapp.com",
      databaseURL: "https://oneaspalclub-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "oneaspalclub",
      storageBucket: "oneaspalclub.firebasestorage.app",
      messagingSenderId: "310756119151",
      appId: "1:310756119151:web:da5d0ccbc43dad23c5b39a"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    init();
    animate();

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a1a);
      
      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 8, 8);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.getElementById('canvas-container').appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.1;
      controls.minDistance = 5;
      controls.maxDistance = 15;
      controls.maxPolarAngle = Math.PI / 2.2;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);
      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(5, 10, 5);
      scene.add(directionalLight);

      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      createBoard();
      updatePieces(); // Initial empty board

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('click', onMouseClick);
      window.addEventListener('touchend', onTouchEnd);

      document.getElementById('reset-btn').addEventListener('click', resetGame);

      if (matchId) {
        listenToMatch();
      } else {
        document.getElementById('status').innerText = "Error: Match ID tidak ditemukan.";
      }
    }

    function listenToMatch() {
      db.ref('chessMatches/' + matchId).on('value', (snapshot) => {
        const match = snapshot.val();
        if (!match) {
          document.getElementById('status').innerText = "Partai tidak ditemukan.";
          return;
        }
        
        if (match.whitePlayer && match.whitePlayer.id === playerId) myColor = 'w';
        if (match.blackPlayer && match.blackPlayer.id === playerId) myColor = 'b';
        
        chess.reset();
        const movesData = match.moves ? Object.keys(match.moves).map(k => match.moves[k]).sort((a,b) => a.timestamp - b.timestamp) : [];
        movesData.forEach(m => {
          chess.move({ from: m.from, to: m.to, promotion: m.promotion || 'q' });
        });
        
        updatePieces();
        isBoardReady = true;
      });
    }

    function createBoard() {
      const squareSize = 1;
      const geometry = new THREE.BoxGeometry(squareSize, 0.2, squareSize);
      
      for (let x = 0; x < 8; x++) {
        board[x] = [];
        for (let z = 0; z < 8; z++) {
          const isWhite = (x + z) % 2 === 0;
          const material = new THREE.MeshLambertMaterial({ color: isWhite ? 0xe0e0e0 : 0x4a4a4a });
          const square = new THREE.Mesh(geometry, material);
          square.position.set(x - 3.5, 0, z - 3.5);
          square.userData = { x, z, isWhite };
          scene.add(square);
          board[x][z] = square;
        }
      }
      const baseGeo = new THREE.BoxGeometry(9, 0.5, 9);
      const baseMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
      const base = new THREE.Mesh(baseGeo, baseMat);
      base.position.y = -0.3;
      scene.add(base);
    }

    function createPiece(type, color, x, z) {
      const group = new THREE.Group();
      const material = new THREE.MeshLambertMaterial({ color: color === 'w' ? 0xffffff : 0x111111 });
      
      switch(type) {
        case 'p': 
          group.add(new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 0.4, 16), material));
          const pHead = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), material);
          pHead.position.y = 0.35;
          group.add(pHead);
          break;
        case 'r': 
          group.add(new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.5, 16), material));
          const rTop = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.2, 0.5), material);
          rTop.position.y = 0.35;
          group.add(rTop);
          break;
        case 'n': 
          group.add(new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 0.4, 16), material));
          const nHead = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.4, 0.5), material);
          nHead.position.y = 0.4;
          nHead.rotation.x = -0.3;
          group.add(nHead);
          break;
        case 'b': 
          group.add(new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 0.5, 16), material));
          const bTop = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.4, 16), material);
          bTop.position.y = 0.45;
          group.add(bTop);
          break;
        case 'q': 
          group.add(new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.3, 0.6, 16), material));
          const qTop = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), material);
          qTop.position.y = 0.45;
          group.add(qTop);
          break;
        case 'k': 
          group.add(new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.3, 0.7, 16), material));
          const kCross1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.3, 0.1), material);
          kCross1.position.y = 0.55;
          const kCross2 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.3), material);
          kCross2.position.y = 0.55;
          group.add(kCross1, kCross2);
          break;
      }
      
      group.position.set(x - 3.5, 0.15, z - 3.5);
      group.userData = { type, color, x, z };
      return group;
    }

    function updatePieces() {
      pieces.forEach(p => scene.remove(p));
      pieces = [];
      const boardData = chess.board();
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const piece = boardData[r][c];
          if (piece) {
            const x = c;
            const z = 7 - r;
            const piece3D = createPiece(piece.type, piece.color, x, z);
            pieces.push(piece3D);
            scene.add(piece3D);
          }
        }
      }
      updateStatus();
    }

    function resetGame() {
      if (matchId) {
        db.ref('chessMatches/' + matchId + '/moves').remove();
      }
    }

    function clearHighlights() {
      for (let x = 0; x < 8; x++) {
        for (let z = 0; z < 8; z++) {
          const isWhite = (x + z) % 2 === 0;
          board[x][z].material.color.setHex(isWhite ? 0xe0e0e0 : 0x4a4a4a);
        }
      }
    }

    function highlightMoves(moves) {
      moves.forEach(move => {
        const x = move.to.charCodeAt(0) - 'a'.charCodeAt(0);
        const z = parseInt(move.to.charAt(1)) - 1;
        board[x][z].material.color.setHex(0xfbbf24);
      });
    }

    function onMouseClick(event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      handleInteraction();
    }

    function onTouchEnd(event) {
      if (event.changedTouches.length > 0) {
        const touch = event.changedTouches[0];
        mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;
        handleInteraction();
      }
    }

    function handleInteraction() {
      if (!isBoardReady || !myColor) return;
      
      raycaster.setFromCamera(mouse, camera);
      const pieceIntersects = raycaster.intersectObjects(pieces, true);
      const squareIntersects = raycaster.intersectObjects(scene.children.filter(c => c.userData.isSquare !== undefined));

      if (pieceIntersects.length > 0) {
        let pieceObj = pieceIntersects[0].object;
        while(pieceObj.parent && !pieceObj.userData.type) pieceObj = pieceObj.parent;
        
        const pieceData = pieceObj.userData;
        
        if (selectedPiece) {
          const from = String.fromCharCode(97 + selectedPiece.x) + (selectedPiece.z + 1);
          const to = String.fromCharCode(97 + pieceData.x) + (pieceData.z + 1);
          tryMove(from, to);
        } else {
          if (chess.turn() === myColor && pieceData.color === myColor) {
            selectedPiece = pieceData;
            clearHighlights();
            const from = String.fromCharCode(97 + pieceData.x) + (pieceData.z + 1);
            const moves = chess.moves({ square: from, verbose: true });
            highlightMoves(moves);
          }
        }
      } else if (squareIntersects.length > 0) {
        const squareData = squareIntersects[0].object.userData;
        if (selectedPiece) {
          const from = String.fromCharCode(97 + selectedPiece.x) + (selectedPiece.z + 1);
          const to = String.fromCharCode(97 + squareData.x) + (squareData.z + 1);
          tryMove(from, to);
        }
      }
    }

    function tryMove(from, to) {
      if (chess.turn() !== myColor) {
        selectedPiece = null;
        clearHighlights();
        return;
      }

      const move = chess.move({ from, to, promotion: 'q' });
      if (move) {
        selectedPiece = null;
        clearHighlights();
        db.ref('chessMatches/' + matchId + '/moves').push({
          from: from,
          to: to,
          promotion: 'q',
          player: playerId,
          timestamp: Date.now()
        });
      } else {
        selectedPiece = null;
        clearHighlights();
      }
    }

    function updateStatus() {
      let statusText = "Giliran: " + (chess.turn() === 'w' ? 'Putih' : 'Hitam');
      if (chess.in_checkmate()) {
        statusText = "Skakmat! Pemenang: " + (chess.turn() === 'w' ? 'Hitam' : 'Putih');
      } else if (chess.in_check()) {
        statusText = "Skak! Giliran: " + (chess.turn() === 'w' ? 'Putih' : 'Hitam');
      }
      document.getElementById('status').innerText = statusText;
      
      let turnText = myColor ? (chess.turn() === myColor ? "Anda (Bermain)" : "Lawan (Menunggu)") : "Menunggu Data...";
      document.getElementById('turn').innerText = turnText;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
